<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#a9ae98">
    <title>24.xsl</title>
    <link rel="icon" href="assets/no-solution.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 左侧书签页签（与主站/按钮墙一致）：竖排贴最左边缘 */
        .site-tabs {
            position: fixed;
            left: 0;
            top: 76px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .site-tab {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 13px 22px 13px 16px;
            color: var(--ink);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.18s ease;
            background: rgba(255,250,240,0.66);
            clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%);
            border: none;
        }
        .site-tab img { height: 20px; width: auto; display: block; flex-shrink: 0; }
        .site-tab svg.icon { width: 18px; height: 18px; fill: currentColor; display: block; flex-shrink: 0; }
        .site-tab:hover { background: rgba(255,250,240,0.86); color: var(--ink); }
        .site-tab.active {
            background: var(--sage);
            color: #fff;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
        <symbol id="icon-sound" viewBox="64 64 896 896"><path d="M625.9 115c-5.9 0-11.9 1.6-17.4 5.3L254 352H90c-8.8 0-16 7.2-16 16v288c0 8.8 7.2 16 16 16h164l354.5 231.7c5.5 3.6 11.6 5.3 17.4 5.3 16.7 0 32.1-13.3 32.1-32.1V147.1c0-18.8-15.4-32.1-32.1-32.1zM586 803L293.4 611.7l-18-11.7H146V424h129.4l17.9-11.7L586 221v582zm348-327H806c-8.8 0-16 7.2-16 16v40c0 8.8 7.2 16 16 16h128c8.8 0 16-7.2 16-16v-40c0-8.8-7.2-16-16-16zm-41.9 261.8l-110.3-63.7a15.9 15.9 0 00-21.7 5.9l-19.9 34.5c-4.4 7.6-1.8 17.4 5.8 21.8L856.3 800a15.9 15.9 0 0021.7-5.9l19.9-34.5c-4.4-7.6-1.7-17.4-5.8-21.8zM760 344a15.9 15.9 0 0021.7 5.9L892 286.2c7.6-4.4 10.2-14.2 5.8-21.8L878 230a15.9 15.9 0 00-21.7-5.9L746 287.8a15.99 15.99 0 00-5.8 21.8L760 344z"/></symbol>
        <symbol id="icon-random-shuffle" viewBox="0 0 1024 1024"><path d="M740.144 325.536l-31.456-31.456a16 16 0 0 1-4.688-11.312v-28.304a14.464 14.464 0 0 1 24.688-10.24l97.824 97.824a11.136 11.136 0 0 1 0 15.744l-97.824 97.808a14.464 14.464 0 0 1-24.688-10.24v-28.288a16 16 0 0 1 4.688-11.312l32.224-32.224h-42.464c-91.2 0-162.864 78.304-162.56 184 2.4 133.68-89.68 232-210.4 232H224a16 16 0 0 1-16-16v-16a16 16 0 0 1 16-16h101.504c93.328 0 164.32-75.808 162.384-183.504v-0.432c-0.368-131.328 91.84-232.064 210.56-232.064h41.696z m-41.696 416H768a16 16 0 0 1 16 16v16a16 16 0 0 1-16 16h-69.552c-47.376 0-90.56-16.064-125.28-43.696a13.296 13.296 0 0 1 2.096-22.192l19.68-10.304a16 16 0 0 1 16.592 1.072c3.232 2.256 5.92 4.032 8.048 5.312a151.84 151.84 0 0 0 78.88 21.808z m-288.16-343.744a132.4 132.4 0 0 0-7.936-4.832c-22.672-12.56-48.752-19.424-76.848-19.424H224a16 16 0 0 1-16-16v-16a16 16 0 0 1 16-16h101.504c41.44 0 79.52 11.584 111.568 32.24 0.96 0.608 2 1.312 3.136 2.08a16 16 0 0 1 1.856 24.864l-12.112 11.36a16 16 0 0 1-19.68 1.712z"/></symbol>
    </svg>
    <div class="site-tabs">
        <a class="site-tab" href="../"><svg class="icon" aria-hidden="true"><use href="#icon-sound"></use></svg> 歌单</a>
        <a class="site-tab" href="../buttons/"><svg class="icon" aria-hidden="true"><use href="#icon-random-shuffle"></use></svg> 按钮墙</a>
        <a class="site-tab active" href="./"><img src="../assets/24xsl-title.webp" alt="24点"> 24点</a>
    </div>
    <main class="game-stage" id="game-stage" aria-label="24点游戏">
        <picture class="stage-art" aria-hidden="true">
            <source media="(max-width: 720px)" srcset="assets/stage-mobile.png">
            <img src="assets/stage-desktop.png" alt="">
        </picture>

        <section class="cards-container" id="cards-container" aria-label="扑克牌"></section>

        <header class="title-layer">
            <img src="assets/title-plaque.png" alt="24点，使用加减乘除得出24">
        </header>

        <div class="counter" aria-live="polite">已解决：<span id="solved-count">0</span></div>

        <nav class="controls" aria-label="运算符">
            <button type="button" class="operator-btn" data-operator="+" aria-label="加">
                <img src="assets/operator-plus.png" alt="">
            </button>
            <button type="button" class="operator-btn" data-operator="-" aria-label="减">
                <img src="assets/operator-minus.png" alt="">
            </button>
            <button type="button" class="operator-btn" data-operator="×" aria-label="乘">
                <img src="assets/operator-multiply.png" alt="">
            </button>
            <button type="button" class="operator-btn" data-operator="÷" aria-label="除">
                <img src="assets/operator-divide.png" alt="">
            </button>
            <button type="button" class="operator-btn no-solution-btn" id="no-solution-btn" aria-label="判断无解">
                <img src="assets/no-solution.png" alt="">
            </button>
        </nav>

        <div class="calculation-display" id="calculation-display" aria-live="polite">点击牌开始计算</div>

        <nav class="action-buttons" aria-label="题目操作">
            <button type="button" class="action-btn next-btn" id="next-btn" aria-label="下一题">
                <img src="assets/nav-next.png" alt="">
            </button>
            <button type="button" class="action-btn reset-btn" id="reset-btn" aria-label="重置">
                <img src="assets/nav-reset.png" alt="">
            </button>
            <button type="button" class="action-btn solution-btn" id="solution-btn" aria-label="查看答案">
                <img src="assets/nav-answer.png" alt="">
            </button>
        </nav>
    </main>

    <div class="message-container" id="message-container" aria-live="polite"></div>
    <div class="celebration" id="celebration" aria-hidden="true"></div>
    <script src="game.js"></script>
</body>
</html>
