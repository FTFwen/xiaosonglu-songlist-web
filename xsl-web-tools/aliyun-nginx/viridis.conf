# =============================================================================
# viridis.love 国内加速反代配置（阿里云 ECS · Nginx）
# 架构：国内用户 → ECS(Nginx) ─┬─ 静态资源：proxy_cache 本地缓存 30 天
#                              ├─ /api/* 动态接口：透明转发 CF Pages
#                              └─ 其余页面：转发 CF（短缓存 + stale 兜底）
# 前置：域名 viridis.love 已 ICP 备案；证书用 acme.sh 自动签发（HTTP-01）
# 放置路径：/etc/nginx/conf.d/viridis.conf
# =============================================================================

# ---- 回源用的 DNS 解析缓存（proxy_pass 变量形式必须配 resolver）----
# 阿里云内网 DNS + 公共 DNS 兜底；CF IP 会变，resolver 必须开
resolver 100.100.2.136 223.5.5.5 1.1.1.1 valid=300s ipv6=off;

# ---- 回源上游：Cloudflare Pages 项目永久域（不依赖 viridis.love 的 DNS 指向）----
# DNS 切到 ECS 后 CF 边缘不再服务 viridis.love 自定义域（403/421），
# 但 xsl-songlist.pages.dev 是 Pages 项目永久域，始终可用。
# 变量形式 + resolver 动态解析（upstream 块单次解析实测会被 CF 421 拒）。
# $origin_domain 在 443 server 块内 set。

# ---- 本地缓存目录（磁盘，20GB；按盘大小调；必须在 http{} 顶层）----
proxy_cache_path /var/cache/nginx/viridis levels=1:2 keys_zone=viridis_cache:50m
                 max_size=20g inactive=30d use_temp_path=off;

map $request_method $skip_cache {
    default        0;
    POST           1;
    PUT            1;
    DELETE         1;
}

# 判断是否静态可缓存资源（音频/图片/CSS/JS/字体 + 版本化 URL）
map $uri $is_static_asset {
    default                        0;
    ~*^/assets/audio/              1;
    ~*^/assets/midautumn/          1;
    ~*^/assets/                    1;
    ~*\.css$                       1;
    ~*\.js$                        1;
    ~*\.webp$                      1;
    ~*\.png$                       1;
    ~*\.jpg$                       1;
    ~*\.jpeg$                      1;
    ~*\.gif$                       1;
    ~*\.svg$                       1;
    ~*\.ico$                       1;
    ~*\.woff2?$                    1;
    ~*\.m4a$                       1;
    ~*\.mp3$                       1;
    ~*\.json$                      0;   # 数据 JSON 要实时（歌曲目录），不缓存
}

server {
    listen 80;
    server_name viridis.love www.viridis.love;
    # HTTP 只做证书验证与跳转
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name viridis.love www.viridis.love;

    # ---- 证书（acme.sh 签发，路径按 acme.sh --installcert 实际填写）----
    ssl_certificate     /etc/nginx/certs/viridis.love.fullchain.cer;
    ssl_certificate_key /etc/nginx/certs/viridis.love.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 访问日志（排查国内用户体验用）----
    access_log /var/log/nginx/viridis.access.log;
    error_log  /var/log/nginx/viridis.error.log warn;

    # ---- 覆盖源站缓存策略（CF 首页返回 max-age=0 must-revalidate，不覆盖则永远 MISS）----
    proxy_ignore_headers Cache-Control Expires Set-Cookie;

    # ---- 通用回源设置 ----
    set $origin_domain xsl-songlist.pages.dev;   # 回源目标：Pages 永久域
    proxy_http_version 1.1;
    # Host/SNI 都用 pages.dev 永久域（CF 边缘只认它）；原域名放在扩展头里备查
    proxy_set_header Host xsl-songlist.pages.dev;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-Host $host;

    # 回源 CF 固定用 443 + TLS（SNI=pages.dev 永久域）
    proxy_ssl_server_name on;
    proxy_ssl_name xsl-songlist.pages.dev;

    # 回源超时：CF 偶发慢，给足余量但别无限等
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # ---- 1. 动态 API：零缓存透明转发 ----
    location /api/ {
        proxy_pass https://$origin_domain;
        proxy_cache off;
        add_header X-Cache-Status "BYPASS-DYNAMIC" always;
        # 长音频 PUT 上传（管理员传音频）放宽超时
        client_max_body_size 64m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 2. 数据 JSON（歌曲目录等）：微缓存 60s，国内用户体感实时 ----
    location ~* ^/data/xiaosonglu/ {
        proxy_pass https://$origin_domain;
        proxy_cache viridis_cache;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 60s;
        proxy_cache_valid any 10s;
        proxy_cache_lock on;                    # 并发回源合并
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ---- 3. 静态资源（音频/图片/CSS/JS）：本地缓存 30 天 ----
    # 音频带 ?v= 哈希参数，同名更新会换 URL，可以放心长缓存
    location ~* ^/assets/ {
        proxy_pass https://$origin_domain;
        proxy_cache viridis_cache;
        proxy_cache_key "$scheme$host$request_uri";   # 含 ?v= 查询串
        proxy_cache_valid 200 30d;
        proxy_cache_valid any 5m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # CF 边缘对复用连接的 Host 校验严格（421），音频走独立连接不复用
        proxy_http_version 1.1;
        proxy_set_header Connection close;
        # 音频拖动进度条需要 Range 透传
        proxy_force_ranges on;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        add_header X-Cache-Status $upstream_cache_status always;
        # 浏览器侧也长缓存（版本化 URL 天然安全）
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- 4. 页面与其余路径：转发 + 1 分钟微缓存 + stale 兜底 ----
    location / {
        proxy_pass https://$origin_domain;
        proxy_cache viridis_cache;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 1m;
        proxy_cache_valid any 30s;
        proxy_cache_lock on;
        # CF 抽风时给用户返回旧页面，而不是白屏
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
