# =============================================================================
# viridis.love 国内加速反代配置（阿里云 ECS · Nginx）
# 架构：国内用户 → ECS(Nginx) ─┬─ 静态资源：proxy_cache 本地缓存 30 天
#                              ├─ /api/* 动态接口：透明转发 CF Pages
#                              └─ 其余页面：转发 CF（短缓存 + stale 兜底）
# 放置路径：/etc/nginx/conf.d/viridis.conf
#
# 2026-10-19 修复（回源拿到半截响应 / 页面打不开 / 部署后看不到新内容）：
#   1. 回源上游固定为已验证的 CF 边缘 IP，坏 IP 只做兜底（见 upstream）
#   2. 回源失败/超时/5xx 自动换 IP 重试，不把半截响应丢给客户端
#   3. 缓存键区分 Accept-Encoding，避免 br 变体污染 plain 请求
#   4. 客户端 Cache-Control: no-cache 直接绕过缓存，部署后校验能看到新内容
#   5. 回源卡住时继续给旧内容（stale），不让用户白屏
# =============================================================================

# ---- 回源用的 DNS 解析缓存 ----
resolver 100.100.2.136 223.5.5.5 1.1.1.1 valid=300s ipv6=off;

# ---- 回源上游池 ----
# xsl-songlist.pages.dev 有两个 A 记录，实测国内到 CF 的链路上质量差异极大：
#   172.66.44.240  → 3/3 完整，约 1s
#   172.66.47.16   → 0/3 完整（76931 / 40667 / 127952 字节就断）
# 只靠 resolver 让 nginx 自选，约有一半回源拿到半截内容；而「慢速回源」不会被
# 判成失败，max_fails 兜不住，所以这里显式排序：好 IP 主用，坏 IP 仅作兜底。
# 若日后国内链路变化，可重跑每 IP 三连测再调整这两行。
upstream cf_pages {
    # 注意：max_fails 必须是 0（永不下线）。这条链路的问题是「偶发握手超时」，
    # 若设 max_fails=1，一次超时就把好 IP 踢掉 30s，备份 IP 又不可用，
    # nginx 会直接对所有请求返回 502 "no live upstreams"（已实测踩过）。
    server 172.66.44.240:443  max_fails=0;
    server 172.66.47.16:443   backup;
    # ECS → Cloudflare 的 TLS 握手本身就不稳（error log 里大量
    # "upstream timed out while SSL handshaking"），每次请求重握手等于碰运气。
    # 开 keepalive 复用连接，把「每请求一次握手」变成「连接池里取一条」。
    keepalive              16;
    keepalive_requests     200;
    keepalive_timeout      60s;
}

# ---- 本地缓存目录（磁盘，20GB；按盘大小调；必须在 http{} 顶层）----
proxy_cache_path /var/cache/nginx/viridis levels=1:2 keys_zone=viridis_cache:50m
                 max_size=20g inactive=30d use_temp_path=off;

map $request_method $skip_cache {
    default        0;
    POST           1;
    PUT            1;
    DELETE         1;
}

# 缓存变体归一：把一长串 Accept-Encoding 收敛成三个桶，
# 保证「能解 br 的客户端」和「只能解 identity 的客户端」不互相污染缓存。
map $http_accept_encoding $viridis_cache_enc {
    default    "plain";
    ~*br       "br";
    ~*gzip     "gzip";
}

# 客户端显式 no-cache 时绕过缓存回源（部署后校验、强制刷新用）
map $http_cache_control $viridis_bypass_cache {
    default     0;
    ~*no-cache  1;
}

server {
    listen 80;
    server_name viridis.love www.viridis.love;
    # HTTP 只做证书验证与跳转
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name viridis.love www.viridis.love;

    # ---- 本地站点镜像（由 xsl-web-tools/sync_site_to_ecs.ps1 同步）----
    # 为什么不用 CF 直接回源：ECS → Cloudflare 这条链路对大文件不稳定，
    # 170KB 的 index.html、1MB 的 js/data.js 经常传到一半就断，
    # 冷缓存时用户会拿到半截页面。文本资源改由本地磁盘直接提供，
    # 回源 CF 只作为「文件缺失」时的兜底。
    root /var/www/viridis-site;

    # 文本资源在本地压缩（比让 CF 传 br 体更可靠）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml text/xml image/svg+xml;

    # ---- 证书（acme.sh 签发）----
    ssl_certificate     /etc/nginx/certs/viridis.love.fullchain.cer;
    ssl_certificate_key /etc/nginx/certs/viridis.love.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 访问日志（排查国内用户体验用）----
    access_log /var/log/nginx/viridis.access.log;
    error_log  /var/log/nginx/viridis.error.log warn;

    # ---- 覆盖源站缓存策略（CF 首页返回 max-age=0 must-revalidate，不覆盖则永远 MISS）----
    proxy_ignore_headers Cache-Control Expires Set-Cookie;

    # ---- 通用回源设置 ----
    proxy_http_version 1.1;
    # Host/SNI 都用 pages.dev 永久域（CF 边缘只认它）；原域名放在扩展头里备查
    proxy_set_header Host xsl-songlist.pages.dev;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-Host $host;

    # 回源 CF 固定用 443 + TLS（SNI=pages.dev 永久域）
    proxy_ssl_server_name on;
    proxy_ssl_name xsl-songlist.pages.dev;

    # 回源超时：普通请求 30s 内没传完就换 IP 重试（原来的 30s 是直接截断返回）
    proxy_connect_timeout 15s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # ---- 回源失败重试：换一个 CF IP 再来，别把半截响应丢给用户 ----
    proxy_next_upstream         error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries   2;
    proxy_next_upstream_timeout 60s;

    # ---- 缓冲区：尽量把整份响应缓冲完再发，避免半截内容已经写回客户端 ----
    proxy_buffering            on;
    proxy_buffer_size          32k;
    proxy_buffers              32 32k;
    proxy_busy_buffers_size    512k;
    proxy_max_temp_file_size   1024m;
    proxy_temp_file_write_size 64k;

    # ---- 缓存通用策略：回源卡住时继续供旧内容，后台刷新 ----
    proxy_cache_lock              on;
    proxy_cache_lock_timeout      20s;
    proxy_cache_lock_age          30s;
    proxy_cache_background_update on;
    proxy_cache_use_stale         error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_bypass            $viridis_bypass_cache;

    # ---- 0. 直播状态：前端每 60s 轮询一次且带 ?t= 时间戳，天然绕过一切缓存；
    #         而回源握手经常超时，用户会看到状态挂掉。这里按 $uri 做 5 秒微缓存
    #         （忽略 ?t=），回源失败时给最后已知状态，不做「白屏」。----
    location = /api/live-status {
        proxy_pass https://cf_pages;
        proxy_cache viridis_cache;
        proxy_cache_key "$scheme$host/api/live-status";
        proxy_cache_valid 200 5s;
        # 只缓存成功响应：否则一次回源超时会把 504 钉在缓存里 2 秒并发给所有人
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ---- 1. 动态 API：零缓存透明转发 ----
    location /api/ {
        proxy_pass https://cf_pages;
        proxy_cache off;
        proxy_cache_bypass 1;
        add_header X-Cache-Status "BYPASS-DYNAMIC" always;
        # 长音频 PUT 上传（管理员传音频）放宽超时
        client_max_body_size 64m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 2. 数据 JSON：直接读本地镜像（部署后由同步脚本刷新）----
    # 原先靠回源 CF + 120s 微缓存，链路抖动时会返回半截 JSON，前端直接白屏。
    location ~* ^/data/ {
        root /var/www/viridis-site;
        try_files $uri @cf;
        add_header Cache-Control "public, max-age=60" always;
        add_header X-Served-From "local" always;
    }

    # ---- 2a. js/data.js 例外：内容每次部署都在变，但 HTML 里的版本号 ?v= 长期不变，
    # 沿用下面 7 天缓存的规则会让回访用户看不到新收录的歌和新标签。改成 60 秒 + 校验。
    # （精确匹配优先于下面的正则 location）
    location = /js/data.js {
        root /var/www/viridis-site;
        try_files $uri @cf;
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        add_header X-Served-From "local" always;
    }

    location = /workshop/js/data.js {
        root /var/www/viridis-site;
        try_files $uri @cf;
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        add_header X-Served-From "local" always;
    }

    # ---- 2b. JS / CSS：本地读盘 + 7 天缓存（HTML 里带 ?v= 版本号，天然安全）----
    location ~* \.(?:css|js)$ {
        root /var/www/viridis-site;
        try_files $uri @cf;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Served-From "local" always;
    }

    # ---- 3. 静态资源（音频/图片）：本地磁盘优先，本地没有才回源 ----
    # 实测 ECS -> Cloudflare 只有约 3 KB/s，回源取音频等于不可用；
    # 音频与图片改由 xsl-web-tools/push_assets_to_ecs.ps1 同步到本地磁盘。
    # 音频带 ?v= 哈希参数，同名更新会换 URL，可以放心长缓存。
    location ~* ^/assets/ {
        root /var/www/viridis-site;
        try_files $uri @cf_assets;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Served-From "local" always;
        # 大文件走 sendfile，磁盘直出
        sendfile on;
        tcp_nopush on;
        aio threads;
    }

    # 本地暂时缺失的资源才回源；禁止把 4xx/5xx 缓存下来
    location @cf_assets {
        proxy_pass https://cf_pages;
        proxy_cache viridis_cache;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 206 30d;
        proxy_cache_valid 404 5m;
        proxy_cache_lock on;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_force_ranges on;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Served-From "origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- 4. 页面与其余路径：优先本地镜像，缺失才回源 CF ----
    location / {
        root /var/www/viridis-site;
        try_files $uri $uri/index.html @cf;
        add_header Cache-Control "public, max-age=60" always;
        add_header X-Served-From "local" always;
    }

    # ---- 兜底：本地没有的文件才回源（路径要 rewrite 回原样）----
    location @cf {
        proxy_pass https://cf_pages;
        proxy_cache viridis_cache;
        proxy_cache_key "$scheme$host$request_uri|$viridis_cache_enc";
        proxy_cache_valid 200 2m;
        # 只缓存 404 一小会儿；4xx/5xx 一律不缓存（曾把 403 缓存成 HIT）
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        # ECS -> CF 只有约 3 KB/s，回源本来就救不回来；快速失败好过让用户干等
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Served-From "origin" always;
    }
}
