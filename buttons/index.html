<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小松绿按钮墙</title>
  <link rel="icon" href="../assets/xiaosonglu-bubble.png" type="image/png">
  <style>
    /* 标题可爱字体：站酷快乐体（ZCOOL KuaiLe），与主站一致 */
    @font-face {
      font-family: 'Xiaosonglu KuaiLe';
      src: url('../assets/xiaosonglu-kuaile-subset.woff2?v=3') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    /* 图标（Ant Design 线性图标）：跟随文字颜色 */
    .icon {
      width: 1em;
      height: 1em;
      fill: currentColor;
      vertical-align: -0.125em;
      display: inline-block;
      flex-shrink: 0;
    }
    :root {
      color-scheme: light;
      --bg: #f4f6e8;
      --surface: #ffffff;
      --surface-soft: #f7f9ec;
      --line: #e3e8c8;
      --line-strong: #c3cd9a;
      --text: #3d4630;
      --text-soft: #7d865f;
      --primary: #8a9a4e;
      --primary-dark: #6f7d3d;
      --primary-soft: #eef1d6;
      --danger: #d9536f;
      --danger-soft: #ffe7ec;
      --success: #2e9b60;
      --success-soft: #e7f7ef;
      --warning: #b57d1c;
      --warning-soft: #fdf3e0;
      --shadow: 0 12px 36px rgba(122, 136, 70, 0.16);
      --peach: #e8b890;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: url('../assets/bg-full.png?v=6') right bottom/auto 100vh no-repeat fixed;
      color: var(--text);
      font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    .app { position: relative; z-index: 1; }

    /* 居中容器：与主站一致（1180px 居中、带阴影、两侧留空） */
    .app {
      max-width: 1180px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg);
      box-shadow: 0 0 40px rgba(122, 136, 70, 0.10);
    }

    /* 左侧页签：主站 / 按钮墙 切换（笔记本书签样式，竖排贴最左边缘） */
    .site-tabs {
      position: fixed;
      left: 0;
      top: 76px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .site-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 14px 0 12px;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.18s ease;
      position: relative;
      border: none;
      height: 46px;
      overflow: visible;
      /* 书签造型通过伪元素背景裁剪，图标可超出 */
      background: transparent;
    }
    .site-tab::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.58);
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%);
      z-index: 0;
      transition: background 0.18s ease;
    }
    .site-tab > * { position: relative; z-index: 1; }
    .site-tab img { height: 52px; width: auto; display: block; flex-shrink: 0; object-fit: contain; }
    .site-tab svg.icon { width: 18px; height: 18px; display: block; flex-shrink: 0; }
    .site-tab:hover::before { background: rgba(255,255,255,0.78); }
    .site-tab:hover { color: var(--text); }
    .site-tab.active { color: #3c4a22; font-weight: 800; text-shadow: none; -webkit-text-stroke: 0; }
    .site-tab.active::before { background: rgba(138,154,78,0.36); }

    /* 头部横幅（参考主站小松绿主题布局，位于 .app 内居中限宽） */
    .banner {
      background-image: linear-gradient(rgba(122, 136, 70, 0.9), rgba(104, 118, 58, 0.94)), url('../assets/xiaosonglu-bg.jpg');
      background-size: cover;
      background-position: center;
      color: #fff;
      padding: 16px 20px 14px;
      box-shadow: 0 8px 24px rgba(122, 136, 70, 0.26);
    }
    .banner-top {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .banner-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: rgba(255,255,255,0.18);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .banner-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
      display: block;
    }
    .banner-main { min-width: 0; flex: 1; }
    .banner h1 {
      font-family: 'Xiaosonglu KuaiLe', 'Microsoft YaHei', sans-serif;
      font-size: 32px;
      line-height: 1.2;
      margin: 2px 0 0;
      font-weight: 400;
      color: #fdf7d8; /* 奶油黄，贴合小松绿橄榄/奶油主题 */
      letter-spacing: 0.02em;
      text-shadow: 0 1px 3px rgba(96, 108, 48, 0.35);
    }

    /* 管理员登录键 */
    .admin-login-btn {
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.14);
      color: #fff;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .admin-login-btn:hover { background: rgba(255,255,255,0.28); }

    /* 手机端竖排导航按钮（替代左侧书签页签） */
    .banner-nav {
      display: none;
      flex-direction: column;
      gap: 6px;
      align-items: stretch;
    }
    .banner-nav a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.14);
      color: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.18s ease;
      white-space: nowrap;
    }
    .banner-nav a:hover { background: rgba(255,255,255,0.26); }
    .banner-nav a.active { background: var(--primary-soft); color: var(--primary-dark); border-color: var(--primary); }
    .banner-nav a.icon-only {
      border: none;
      background: transparent;
      padding: 0;
      justify-content: center;
    }
    .banner-nav a.icon-only:hover { background: transparent; }
    .banner-nav a img { height: 26px; width: auto; }

    /* 手机端：隐藏左侧书签、隐藏管理员、显示 bannernav */
    @media (max-width: 768px) {
      .site-tabs { display: none; }
      .banner-nav { display: flex; }
      .admin-login-btn { display: none; }
    }

    /* 主体：垂直条目列表 */
    .wall {
      max-width: 1000px;
      margin: 0 auto;
      padding: 26px 20px 60px;
    }

    /* 分类区块标题 */
    .cat-section { margin-bottom: 34px; }
    .cat-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .cat-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(122, 136, 70, 0.3);
      flex-shrink: 0;
    }
    .cat-title { font-family: 'Xiaosonglu KuaiLe', 'Microsoft YaHei', sans-serif; font-size: 22px; font-weight: 400; color: var(--text); }
    .cat-count { font-size: 12px; color: var(--text-soft); }

    /* 垂直按钮列表：一条一条的横向卡片 */
    .btn-list { display: flex; flex-wrap: wrap; gap: 10px; }
    .sound-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: auto;
      max-width: 100%;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 14px;
      padding: 10px 14px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 20px rgba(122, 136, 70, 0.05);
      color: var(--text);
      position: relative;
      overflow: visible;
    }
    .sound-btn:hover {
      border-color: var(--primary);
      box-shadow: 0 10px 24px rgba(122, 136, 70, 0.10);
      transform: translateY(-2px);
    }
    .sound-btn:active { transform: scale(0.97); }
    .sound-btn.playing { border-color: var(--primary); background: var(--primary-soft); }

    .sb-main { min-width: 0; overflow: hidden; }
    .sb-name { font-size: 15px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 时长：右侧灰色小字，参考站"1s"样式 */
    .sb-dur {
      font-size: 12px;
      color: var(--text-soft);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }
    .sound-btn .bar {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--peach));
    }

    /* 空分类 */
    .empty-hint {
      text-align: center;
      color: var(--text-soft);
      padding: 30px 20px;
      font-size: 14px;
      line-height: 1.8;
      border: 1px dashed var(--line-strong);
      border-radius: 14px;
      background: var(--surface-soft);
    }

    /* ===== 管理员后台 ===== */
    .admin-panel {
      position: fixed;
      inset: 0;
      background: rgba(40, 48, 24, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(3px);
    }
    .admin-panel.show { display: flex; }
    .admin-card {
      background: #fff;
      border-radius: 18px;
      padding: 22px 24px;
      width: min(520px, calc(100vw - 28px));
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
    }
    .admin-card h2 { margin: 0 0 16px; font-size: 18px; color: var(--text); }

    .login-form { display: flex; flex-direction: column; gap: 10px; }
    .login-form input {
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }
    .login-form input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(138, 154, 78, 0.15); }
    .auth-err { color: var(--danger); font-size: 12px; min-height: 16px; }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn-x {
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--text-soft);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .btn-x.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-x.danger { background: var(--danger-soft); border-color: #f7b8c3; color: #bc435d; }
    .btn-x:hover { opacity: 0.88; }

    .admin-sec-title { font-size: 14px; color: var(--text); margin: 18px 0 8px; font-weight: 700; }
    .admin-toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .admin-input, .admin-textarea {
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      width: 100%;
      margin-bottom: 6px;
      font-family: inherit;
    }
    .admin-input:focus, .admin-textarea:focus { border-color: var(--primary); }
    .admin-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 6px;
      background: var(--surface-soft);
    }
    .admin-item .grow { flex: 1; min-width: 0; }
    .admin-item .nm { font-weight: 700; font-size: 13px; }
    .admin-item .ds { font-size: 11px; color: var(--text-soft); }
    .admin-item select, .admin-item input {
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 5px 7px;
      font-size: 12px;
      min-width: 0;
    }

    /* ===== 后台：分类拖拽排序手柄 ===== */
    .cat-drag-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      color: var(--text-soft);
      cursor: grab;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .cat-drag-handle:hover { background: var(--primary-soft); color: var(--primary-dark); }
    .cat-drag-handle.disabled { color: #c8cdd6; cursor: not-allowed; }
    .cat-drag-handle.disabled:hover { background: transparent; }
    .cat-admin-item.dragging { opacity: 0.45; }
    .cat-admin-item.drop-over {
      box-shadow: 0 0 0 2px var(--primary);
      border-radius: 10px;
    }
    .cat-admin-item.cat-last { opacity: 0.75; }

    /* ===== 后台：拖拽分类桶 ===== */
    .cat-zone-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .cat-zone {
      border: 2px dashed var(--line-strong);
      border-radius: 10px;
      padding: 10px 14px;
      text-align: center;
      min-width: 90px;
      flex: 0 0 auto;
      background: var(--surface-soft);
      transition: all 0.15s ease;
    }
    .cat-zone .zone-name { display: block; font-weight: 700; font-size: 13px; }
    .cat-zone .zone-count { display: block; font-size: 11px; color: var(--text-soft); min-height: 14px; }
    .cat-zone.over {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: scale(1.03);
    }

    /* ===== 后台按钮条目：可拖拽 + 音频上传 ===== */
    .btn-admin-item { cursor: grab; }
    .btn-admin-item.dragging { opacity: 0.5; }
    .btn-admin-item .audio-upload {
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      max-width: 110px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .admin-item .ds.has { color: var(--success); }

    /* ===== 上传进度条 ===== */
    .upload-progress {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-soft);
    }
    .upload-progress-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .upload-progress-label { font-size: 12px; font-weight: 700; color: var(--text); }
    .upload-progress-count { font-size: 12px; color: var(--text-soft); font-variant-numeric: tabular-nums; }
    .upload-progress-bar {
      height: 8px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }
    .upload-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), #7a8848);
      transition: width 0.2s ease;
    }
    .upload-progress-fill.done { background: var(--success); }
    .upload-progress-status {
      margin-top: 5px;
      font-size: 11px;
      color: var(--text-soft);
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 60px;
      overflow-y: auto;
    }

    .admin-tip {
      font-size: 11px;
      color: var(--text-soft);
      margin: 2px 0 8px;
      line-height: 1.5;
    }

    /* ===== 顶部播放器：圆角方框卡片（常驻置顶，对齐参考站） ===== */
    .player-card {
      position: sticky;
      top: 12px;
      z-index: 90;
      max-width: 1080px;
      margin: 18px auto 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(122, 136, 70, 0.14);
    }
    .player-card .pc-left { flex: 1; min-width: 0; }
    .player-card .pc-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-soft);
      margin-bottom: 4px;
    }
    .player-card .pc-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--peach);
      flex-shrink: 0;
    }
    .player-card .pc-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .player-card .pc-time {
      font-size: 12px;
      color: var(--text-soft);
      font-variant-numeric: tabular-nums;
      margin-top: 3px;
    }
    .player-card .pc-progress-wrap {
      height: 5px;
      background: var(--surface-soft);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
      max-width: 320px;
    }
    .player-card .pc-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--peach));
      transition: width 0.2s linear;
      border-radius: 999px;
    }
    .player-card .pc-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }
    /* 停止播放 + 随机播放：横向一排 */
    .player-card .pc-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .player-card .pc-stop {
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 8px 18px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .player-card .pc-stop:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
    /* 随机播放：带文字胶囊按钮（hove 用橄榄绿） */
    .player-card .pc-random-text {
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 8px 18px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .player-card .pc-random-text:hover {
      border-color: var(--primary);
      color: var(--primary-dark);
      background: var(--primary-soft);
    }
    .player-card .pc-ctrls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .player-card .pc-play {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.18s ease;
    }
    .player-card .pc-play:hover { background: var(--primary-dark); }
    .player-card .pc-mode {
      border: none;
      background: transparent;
      color: var(--text-soft);
      font-size: 18px;
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      transition: all 0.18s ease;
    }
    .player-card .pc-mode:hover,
    .player-card .pc-mode.single { color: var(--primary-dark); }
    .player-card .pc-vol {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .player-card .pc-vol span { font-size: 14px; }
    .player-card .pc-vol input[type=range] {
      width: 90px;
      accent-color: var(--primary);
    }
    .player-card .pc-close {
      border: none;
      background: transparent;
      color: var(--text-soft);
      font-size: 15px;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: all 0.18s ease;
    }
    .player-card .pc-close:hover { background: var(--danger-soft); color: var(--danger); }

    /* 图标（Ant Design 线性图标，跟随文字颜色）：与主站一致 */
    .icon {
      width: 1em;
      height: 1em;
      fill: currentColor;
      vertical-align: -0.125em;
      display: inline-block;
      flex-shrink: 0;
    }

    /* ===== 编辑模式 ===== */
    .edit-float {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 90;
      display: flex;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px;
      box-shadow: var(--shadow);
    }
    /* 磁贴编辑态：显示删除按钮、可拖动 */
    body.editing .sound-btn {
      cursor: move;
      box-shadow: 0 0 0 2px rgba(138, 154, 78, 0.25);
    }
    body.editing .sound-btn .sb-del { display: grid !important; }
    .sound-btn .sb-del {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--danger);
      background: #fff;
      color: var(--danger);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 11px;
      z-index: 5;
    }
    .sound-btn .sb-del:hover { background: var(--danger); color: #fff; }
    .sound-btn.drag-src { opacity: 0.6; box-shadow: 0 0 0 2px var(--primary); }
    .cat-section.drop-target { box-shadow: 0 0 0 2px var(--primary); border-radius: 16px; padding: 6px; }
    /* 副标题样式 */
    .sb-desc { font-size: 12px; color: var(--text-soft); margin-top: 3px; line-height: 1.4; }
  </style>

      <div class="pc-actions">

      <h2 id="adminCardTitle">管理员登录</h2>

      <div class="login-form" id="loginForm">
        <input type="text" id="loginUser" placeholder="用户名" autocomplete="off">
        <input type="password" id="loginPass" placeholder="密码">
        <div class="auth-err" id="authErr"></div>
        <div class="btn-row">
          <button class="btn-x primary" id="loginBtn">登录</button>
          <button class="btn-x" id="cancelLoginBtn">取消</button>
        </div>
      </div>

      <div id="adminBody" style="display:none;">
        <div class="admin-sec-title">分类管理</div>
        <div class="admin-toolbar">
          <input type="text" class="admin-input" id="newCatName" placeholder="新分类名">
          <button class="btn-x primary" id="addCatBtn">+ 添加分类</button>
        </div>
        <div id="catAdminList"></div>

        <div class="admin-sec-title">上传音频/导入压缩包</div>
        <div class="admin-toolbar">
          <select class="admin-input" id="newBtnCat"></select>
          <button class="btn-x primary" id="uploadBtnBtn"><svg class="icon" aria-hidden="true"><use href="#icon-upload"></use></svg> 上传音频/导入压缩包</button>
        </div>
        <input type="file" accept=".mp3,.m4a,.wav,.ogg,.flac,.mp4,.m4v,.mov,.webm,.mkv,audio/*,video/*,.zip" id="newBtnFileInput" multiple style="display:none;">

          <div class="upload-progress-head">
            <span class="upload-progress-label" id="uploadProgressLabel">正在上传…</span>
            <span class="upload-progress-count" id="uploadProgressCount">0 / 0</span>

          <div class="upload-progress-bar">

          </div>
          <div class="upload-progress-status" id="uploadProgressStatus"></div>
        </div>

        <div class="btn-row">
          <button class="btn-x" id="migrateBtn" style="display:none;">把本地音频迁移上云</button>
          <button class="btn-x" id="logoutBtn">退出登录</button>
          <button class="btn-x" id="closeAdminBtn">关闭</button>
        </div>
      </div>
    </div>
  </div>
